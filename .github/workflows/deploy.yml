name: Build & Deploy

on:
  push:
    branches: [main]
  # Permite ejecutar el workflow manualmente desde GitHub
  workflow_dispatch:

env:
  IMAGE_NAME: elgransazon

jobs:
  # ============================
  # JOB 1: Build y verificar
  # ============================
  build:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build con Maven (sin tests por ahora)
        run: chmod +x mvnw && ./mvnw clean package -DskipTests

      - name: Verificar que el JAR se generó
        run: ls -lh target/elgransazon-0.0.1.jar

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Verificar Docker Image
        run: docker images ${{ env.IMAGE_NAME }}

      - name: Test - Contenedor arranca correctamente
        run: |
          # Levanta el contenedor con variables mínimas para verificar que arranca
          docker run -d --name test-app \
            -e DB_HOST=localhost \
            -e DB_PORT=3306 \
            -e DB_NAME=test_db \
            -e DB_USER=root \
            -e DB_PASSWORDSECRET=test \
            -e API_PROTOCOL=http \
            -e API_HOST=localhost \
            -e API_PORT=8080 \
            -p 8080:8080 \
            ${{ env.IMAGE_NAME }}:latest

          # Espera unos segundos para que Spring intente arrancar
          sleep 15

          # Verifica que el contenedor sigue corriendo (no crasheó inmediatamente)
          # Nota: Puede fallar la conexión a DB, pero el JAR debe cargar
          echo "=== Container Status ==="
          docker ps -a --filter name=test-app
          echo "=== Container Logs ==="
          docker logs test-app 2>&1 | tail -50

          # Limpieza
          docker stop test-app || true
          docker rm test-app || true

      - name: Build exitoso
        run: echo "✅ Build y Docker Image creados correctamente. Listo para deploy."

  # ============================
  # JOB 2: Deploy al servidor
  # ============================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    # Solo ejecuta deploy si los secrets del servidor están configurados
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build con Maven
        run: chmod +x mvnw && ./mvnw clean package -DskipTests

      - name: Copiar archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "target/elgransazon-0.0.1.jar,docker-compose.yml,Dockerfile"
          target: "/home/${{ secrets.SERVER_USERNAME }}/savorycloud"

      - name: Deploy con Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            cd /home/${{ secrets.SERVER_USERNAME }}/savorycloud

            # Crear archivo .env con las variables de producción
            cat > .env << 'ENVFILE'
            API_HOST=${{ secrets.API_HOST }}
            API_PORT=${{ secrets.API_PORT }}
            API_PROTOCOL=${{ secrets.API_PROTOCOL }}
            BASE_DOMAIN=${{ secrets.BASE_DOMAIN }}
            COOKIE_SECURE=true
            DB_PORT=3306
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=root
            DB_PASSWORDSECRET=${{ secrets.DB_PASSWORDSECRET }}
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            FROM_EMAIL=${{ secrets.FROM_EMAIL }}
            FROM_NAME=${{ secrets.FROM_NAME }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            ENVFILE

            # Rebuild y reiniciar contenedores
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            # Verificar que están corriendo
            sleep 10
            docker compose ps
            echo "✅ Deploy completado exitosamente"
