<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${globalSystemConfig.systemName + ' - Historial de Caja'}">
      El Gran Sazón - Historial de Caja
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600;700"
      rel="stylesheet"
    />
    <div th:replace="~{fragments/theme :: themeResources}"></div>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#38e07b",
              "primary-dark": "#2bc866",
              "background-light": "#f8faf9",
              "background-dark": "#0f1713",
            },
            fontFamily: { display: ["Work Sans"] },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              "2xl": "1.5rem",
              "3xl": "2rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-gradient-to-br from-background-light to-gray-50 dark:from-background-dark dark:to-gray-900 font-display min-h-screen"
  >
    <nav class="bg-gradient-to-r from-primary to-primary-dark shadow-lg">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16 sm:h-20">
          <div class="flex items-center gap-4">
            <a
              href="/cashier/cash-register"
              class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white/20 hover:bg-white/30 text-white font-semibold transition-all border border-white/30"
            >
              <span class="material-symbols-outlined">arrow_back</span>
              <span class="hidden sm:inline">Caja</span>
            </a>
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-white text-3xl sm:text-4xl">history</span>
              <span class="text-white text-xl sm:text-2xl font-bold tracking-tight">
                Historial de Caja
              </span>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-24">
      <!-- FILTER -->
      <form
        th:action="@{/cashier/cash-register/history}"
        method="get"
        class="mb-6 rounded-2xl bg-white dark:bg-gray-900 shadow-lg border border-gray-200 dark:border-gray-800 p-5 flex flex-wrap items-end gap-4"
      >
        <div>
          <label class="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-1">
            Día a revisar
          </label>
          <input
            type="date"
            name="date"
            th:value="${filterDate}"
            class="rounded-xl border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-3 py-2 focus:outline-none focus:border-primary"
          />
        </div>
        <button
          type="submit"
          class="flex items-center gap-2 rounded-xl bg-primary text-white px-5 py-2.5 font-bold hover:bg-primary-dark transition"
        >
          <span class="material-symbols-outlined text-lg">search</span>
          Buscar
        </button>
        <a
          href="/cashier/cash-register/history"
          class="rounded-xl border border-gray-300 dark:border-gray-700 px-5 py-2.5 font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition"
        >
          Hoy
        </a>
      </form>

      <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-lg overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-800">
          <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
            Cierres del
            <span th:text="${#temporals.format(filterDate, 'dd/MM/yyyy')}">01/01/2026</span>
            (<span th:text="${#lists.size(rows)}">0</span>)
          </h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
              <tr>
                <th class="px-5 py-3 font-semibold text-gray-700 dark:text-gray-300">Apertura</th>
                <th class="px-5 py-3 font-semibold text-gray-700 dark:text-gray-300">Cierre</th>
                <th class="px-5 py-3 font-semibold text-gray-700 dark:text-gray-300">Estado</th>
                <th class="px-5 py-3 font-semibold text-gray-700 dark:text-gray-300 text-right">Fondo</th>
                <th class="px-5 py-3 font-semibold text-gray-700 dark:text-gray-300 text-right">Vendido</th>
                <th class="px-5 py-3 font-semibold text-gray-700 dark:text-gray-300 text-right">Pagos</th>
                <th class="px-5 py-3 font-semibold text-gray-700 dark:text-gray-300 text-right">Esperado</th>
                <th class="px-5 py-3 font-semibold text-gray-700 dark:text-gray-300 text-right">Contado</th>
                <th class="px-5 py-3 font-semibold text-gray-700 dark:text-gray-300 text-right">Diferencia</th>
                <th class="px-5 py-3 font-semibold text-gray-700 dark:text-gray-300 text-center">Acciones</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
              <tr
                th:each="row : ${rows}"
                class="hover:bg-gray-50 dark:hover:bg-gray-800 transition"
              >
                <td class="px-5 py-3 text-gray-700 dark:text-gray-300 whitespace-nowrap"
                    th:text="${#tz.format(row.session.openedAt, 'dd/MM/yyyy hh:mm a')}">—</td>
                <td class="px-5 py-3 text-gray-700 dark:text-gray-300 whitespace-nowrap"
                    th:text="${row.session.closedAt != null ? #tz.format(row.session.closedAt, 'dd/MM/yyyy hh:mm a') : '—'}">—</td>
                <td class="px-5 py-3">
                  <span
                    class="px-2 py-1 text-xs font-semibold rounded-full"
                    th:classappend="${row.session.open} ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400'"
                    th:text="${row.session.status.displayName}"
                  >Cerrada</span>
                </td>
                <td class="px-5 py-3 text-right text-gray-700 dark:text-gray-300"
                    th:text="${#numbers.formatCurrency(row.summary.initialAmount)}">$0.00</td>
                <td class="px-5 py-3 text-right font-semibold text-gray-900 dark:text-white"
                    th:text="${#numbers.formatCurrency(row.summary.totalSales)}">$0.00</td>
                <td class="px-5 py-3 text-right text-red-600"
                    th:text="${#numbers.formatCurrency(row.summary.totalExpenses.add(row.summary.totalWithdrawals))}">$0.00</td>
                <td class="px-5 py-3 text-right text-gray-700 dark:text-gray-300"
                    th:text="${#numbers.formatCurrency(row.summary.expectedCash)}">$0.00</td>
                <td class="px-5 py-3 text-right text-gray-700 dark:text-gray-300"
                    th:text="${row.summary.countedAmount != null ? #numbers.formatCurrency(row.summary.countedAmount) : '—'}">—</td>
                <td
                  class="px-5 py-3 text-right font-bold"
                  th:classappend="${row.summary.difference != null and row.summary.difference.signum() != 0} ? 'text-red-600' : 'text-gray-700 dark:text-gray-300'"
                  th:text="${row.summary.difference != null ? #numbers.formatCurrency(row.summary.difference) : '—'}"
                >—</td>
                <td class="px-5 py-3">
                  <div class="flex items-center justify-center gap-2">
                    <a
                      th:href="@{'/cashier/cash-register/session/' + ${row.session.id}}"
                      class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-blue-100 text-blue-600 hover:bg-blue-200 transition"
                      title="Ver detalle"
                    >
                      <span class="material-symbols-outlined text-lg">visibility</span>
                    </a>
                    <a
                      th:href="@{'/cashier/cash-register/session/' + ${row.session.id} + '/pdf'}"
                      class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-gray-900 text-white hover:bg-gray-700 transition"
                      title="Descargar PDF"
                    >
                      <span class="material-symbols-outlined text-lg">picture_as_pdf</span>
                    </a>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(rows)}">
                <td colspan="10" class="px-6 py-12 text-center text-gray-500 dark:text-gray-400">
                  No hay cierres de caja para este día.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/theme :: themeScript}"></div>
  </body>
</html>
