<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>Gafete del empleado</title>
  </head>
  <body>
    <!--
      Gafete de una sola tarjeta de empleado. Se usa en la vista de tarjetas de
      admin/employees/list.html y se puede procesar por separado en las pruebas,
      sin base de datos ni barra lateral.
    -->
    <article
      th:fragment="employeeCard(employee, canManageEmployees)"
      class="employee-item employee-card group relative flex flex-col cursor-pointer overflow-hidden rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-lg transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl"
      th:attr="data-name=${employee.fullName.toLowerCase()},
               data-role=${employee.primaryRole},
               data-shifts=${employee.shifts.![id].toString()},
               data-enabled=${employee.enabled},
               data-employee-id=${employee.idEmpleado}"
      th:onclick="'showEmployeeDetails(' + ${employee.idEmpleado} + ')'"
      role="button"
      tabindex="0"
      th:title="'Ver ficha de ' + ${employee.fullName}"
    >
      <!-- Cabecera del gafete -->
      <div
        class="relative overflow-hidden bg-gradient-to-br from-[#0b2545] via-[#15325f] to-[#1d4ed8] px-5 pb-14 pt-4 text-white"
      >
        <span class="badge-decor badge-decor-1"></span>
        <span class="badge-decor badge-decor-2"></span>
        <span class="badge-decor badge-decor-3"></span>

        <div class="relative flex items-start justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <span
              class="flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-lg bg-white/15 ring-1 ring-white/20"
            >
              <span class="material-symbols-outlined text-base"
                >restaurant</span
              >
            </span>
            <div class="leading-tight min-w-0">
              <p
                class="truncate text-[10px] font-bold uppercase tracking-[0.18em] text-white/85"
                th:text="${globalSystemConfig.systemName}"
              >
                El Gran Sazón
              </p>
              <p
                class="truncate text-[8px] uppercase tracking-[0.16em] text-white/55"
              >
                Gafete de personal
              </p>
            </div>
          </div>
          <span
            class="flex flex-shrink-0 items-center gap-1.5 rounded-full px-2.5 py-1 text-[10px] font-semibold ring-1"
            th:classappend="${employee.enabled} ? 'bg-emerald-400/20 text-emerald-100 ring-emerald-300/40' : 'bg-red-400/20 text-red-100 ring-red-300/40'"
          >
            <span
              class="h-1.5 w-1.5 rounded-full"
              th:classappend="${employee.enabled} ? 'bg-emerald-300' : 'bg-red-300'"
            ></span>
            <span
              th:text="${employee.enabled} ? 'Activo' : 'Inactivo'"
              >Activo</span
            >
          </span>
        </div>
      </div>

      <!-- Cuerpo del gafete -->
      <div class="relative -mt-14 px-5 pb-4">
        <!-- Avatar circular con el icono del rol, en lugar de las iniciales -->
        <div
          class="badge-avatar mx-auto h-24 w-24 rounded-full bg-white p-1 shadow-xl ring-1 ring-gray-200/80 dark:bg-gray-900 dark:ring-gray-700"
        >
          <div
            class="badge-avatar-inner flex h-full w-full items-center justify-center rounded-full bg-gradient-to-br from-primary to-primary-dark text-white shadow-inner"
          >
            <span
              th:replace="~{admin/employees/role-icon :: roleIcon(${employee})}"
            ></span>
          </div>
        </div>

        <h3
          class="mt-3 truncate text-center text-lg font-extrabold uppercase leading-tight tracking-wide text-gray-900 dark:text-white"
          th:text="${employee.fullName}"
        >
          Nombre del Empleado
        </h3>
        <p
          class="mt-0.5 truncate text-center text-xs text-gray-500 dark:text-gray-400"
          th:text="'@' + ${employee.username}"
        >
          @usuario
        </p>

        <div class="mt-2.5 flex justify-center">
          <span
            class="inline-flex items-center gap-1 rounded-full bg-blue-50 px-3 py-1 text-[10px] font-bold uppercase tracking-[0.12em] text-blue-700 ring-1 ring-blue-100 dark:bg-blue-500/15 dark:text-blue-300 dark:ring-blue-500/30"
          >
            <span class="material-symbols-outlined text-xs"
              >workspace_premium</span
            >
            <span th:text="${employee.roleDisplayName}">Mesero</span>
          </span>
        </div>

        <!-- Datos que se consultan en el gafete -->
        <div
          class="mt-4 grid grid-cols-2 gap-x-3 gap-y-2.5 rounded-xl border border-gray-100 bg-gray-50 p-3 dark:border-gray-800 dark:bg-gray-800/60"
        >
          <div class="min-w-0">
            <p
              class="text-[9px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500"
            >
              Salario
            </p>
            <p
              class="truncate text-xs font-bold text-green-600 dark:text-green-400"
              th:text="${employee.formattedSalary}"
            >
              $0.00
            </p>
          </div>
          <div class="min-w-0 text-right">
            <p
              class="text-[9px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500"
            >
              Turnos
            </p>
            <p
              class="truncate text-xs font-semibold text-gray-700 dark:text-gray-200"
              th:text="${employee.shiftCount == 1 ? '1 turno' : employee.shiftCount + ' turnos'}"
            >
              0 turnos
            </p>
          </div>
          <div class="min-w-0">
            <p
              class="text-[9px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500"
            >
              Teléfono
            </p>
            <p
              class="truncate text-xs font-semibold text-gray-700 dark:text-gray-200"
              th:text="${#strings.isEmpty(employee.telefono) ? 'Sin teléfono' : employee.telefono}"
              th:title="${#strings.isEmpty(employee.telefono) ? 'Sin teléfono registrado' : employee.telefono}"
            >
              5512345678
            </p>
          </div>
          <div class="min-w-0 text-right">
            <p
              class="text-[9px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500"
            >
              Supervisor
            </p>
            <p
              class="truncate text-xs font-semibold text-gray-700 dark:text-gray-200"
              th:text="${employee.supervisorName}"
              th:title="${employee.supervisorName}"
            >
              Sin supervisor
            </p>
          </div>
        </div>
      </div>

      <!-- Acciones de la tarjeta -->
      <div
        class="mt-auto flex items-center gap-2 border-t border-gray-100 bg-gray-50/80 px-3 py-3 dark:border-gray-800 dark:bg-gray-800/40"
      >
        <a
          th:href="@{/admin/employees/{id}/edit(id=${employee.idEmpleado})}"
          onclick="event.stopPropagation()"
          class="flex flex-1 items-center justify-center gap-1.5 rounded-lg bg-blue-50 px-3 py-2 text-xs font-semibold text-blue-700 transition-colors hover:bg-blue-100 dark:bg-blue-500/15 dark:text-blue-300 dark:hover:bg-blue-500/25"
          title="Editar empleado"
        >
          <span class="material-symbols-outlined text-base">edit</span>
          Editar
        </a>

        <!-- Solo quien administra puede activar/desactivar (y nunca a un ADMIN o PROGRAMMER) -->
        <button
          th:if="${canManageEmployees and !employee.hasRole('ROLE_ADMIN') and !employee.hasRole('ROLE_PROGRAMMER')}"
          type="button"
          class="flex flex-1 items-center justify-center gap-1.5 rounded-lg px-3 py-2 text-xs font-semibold transition-colors"
          th:classappend="${employee.enabled} ? 'bg-red-50 text-red-600 hover:bg-red-100 dark:bg-red-500/15 dark:text-red-300 dark:hover:bg-red-500/25' : 'bg-green-50 text-green-700 hover:bg-green-100 dark:bg-green-500/15 dark:text-green-300 dark:hover:bg-green-500/25'"
          th:attr="data-employee-id=${employee.idEmpleado},
                   data-employee-name=${employee.fullName},
                   data-target-enabled=${!employee.enabled}"
          onclick="onEmployeeCardStatusClick(event, this)"
          th:title="${employee.enabled} ? 'Desactivar empleado' : 'Activar empleado'"
        >
          <span class="material-symbols-outlined text-base"
            >power_settings_new</span
          >
          <span th:text="${employee.enabled} ? 'Desactivar' : 'Activar'"
            >Desactivar</span
          >
        </button>

        <span
          th:if="${canManageEmployees and (employee.hasRole('ROLE_ADMIN') or employee.hasRole('ROLE_PROGRAMMER'))}"
          class="flex flex-1 items-center justify-center gap-1.5 rounded-lg bg-gray-100 px-3 py-2 text-xs font-semibold text-gray-500 dark:bg-gray-800 dark:text-gray-400"
          title="El administrador no puede ser desactivado"
        >
          <span class="material-symbols-outlined text-base"
            >shield_person</span
          >
          Protegido
        </span>
      </div>
    </article>
  </body>
</html>
