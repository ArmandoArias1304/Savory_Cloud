<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>Icono del rol</title>
  </head>
  <body>
    <!--
      Dibujo del rol del empleado para el círculo del gafete: cada rol del sistema
      (ver Role.java) tiene su propio icono de trazo, y el rol desconocido usa la
      silueta genérica de persona. Es decorativo: el nombre del rol se lee en la
      píldora de la tarjeta, así que el SVG queda oculto para lectores de pantalla.
    -->
    <span
      th:fragment="roleIcon(employee)"
      class="inline-flex"
      th:switch="${employee.primaryRole}"
    >
      <!-- Administrador: escudo con visto -->
      <svg
        th:case="'ROLE_ADMIN'"
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 3l7.5 3v5.4c0 4.5-3.1 8.1-7.5 9.6-4.4-1.5-7.5-5.1-7.5-9.6V6L12 3z" />
        <path d="M9 12l2.1 2.1L15.3 10" />
      </svg>

      <!-- Gerente: maletín -->
      <svg
        th:case="'ROLE_MANAGER'"
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <rect x="3" y="7.5" width="18" height="12.5" rx="2.5" />
        <path d="M9 7.5V6.2A2.2 2.2 0 0 1 11.2 4h1.6A2.2 2.2 0 0 1 15 6.2v1.3" />
        <path d="M3 12.5h18" />
      </svg>

      <!-- Mesero: campana de servicio -->
      <svg
        th:case="'ROLE_WAITER'"
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M4 17.5h16" />
        <path d="M6.2 17.5a5.8 5.8 0 0 1 11.6 0" />
        <path d="M12 11.7V9.8" />
        <path d="M9.8 9.8h4.4" />
      </svg>

      <!-- Chef: gorro de cocina -->
      <svg
        th:case="'ROLE_CHEF'"
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M7 14V18.5A1.5 1.5 0 0 0 8.5 20h7a1.5 1.5 0 0 0 1.5-1.5V14" />
        <path d="M7.6 7.2A3.5 3.5 0 1 0 7 14h10a3.5 3.5 0 1 0-.6-6.8A4.5 4.5 0 0 0 7.6 7.2z" />
      </svg>

      <!-- Parrillero: flama -->
      <svg
        th:case="'ROLE_PARRILLERO'"
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 3.2c3.2 3 5.3 5.6 5.3 8.6a5.3 5.3 0 0 1-10.6 0c0-3 2.1-5.6 5.3-8.6z" />
        <path d="M12 10.4c1.3 1.2 2 2.3 2 3.5a2 2 0 1 1-4 0c0-1.2.7-2.3 2-3.5z" />
      </svg>

      <!-- Barista: taza de café -->
      <svg
        th:case="'ROLE_BARISTA'"
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M5.5 8.6h11v5.4a4.6 4.6 0 0 1-4.6 4.6h-1.8a4.6 4.6 0 0 1-4.6-4.6V8.6z" />
        <path d="M16.5 9.6h1.3a2.6 2.6 0 0 1 0 5.2h-1.3" />
        <path d="M8.6 3.2c-.7.9-.7 1.8 0 2.7" />
        <path d="M12 3.2c-.7.9-.7 1.8 0 2.7" />
      </svg>

      <!-- Cajero: tarjeta de cobro -->
      <svg
        th:case="'ROLE_CASHIER'"
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <rect x="2.8" y="5.5" width="18.4" height="13" rx="2.5" />
        <path d="M2.8 10h18.4" />
        <path d="M6.4 14.6h4.2" />
      </svg>

      <!-- Repartidor: camioneta -->
      <svg
        th:case="'ROLE_DELIVERY'"
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M2.6 6.6h10.4v8.8H2.6z" />
        <path d="M13 9.6h4.1l3 3.3v2.5H13z" />
        <circle cx="6.6" cy="17.8" r="1.8" />
        <path d="M8.4 17.8h7.2" />
        <circle cx="17.4" cy="17.8" r="1.8" />
      </svg>

      <!-- Programador: código -->
      <svg
        th:case="'ROLE_PROGRAMMER'"
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M8.4 8L4.4 12l4 4" />
        <path d="M15.6 8l4 4-4 4" />
        <path d="M13.4 5.4l-2.8 13.2" />
      </svg>

      <!-- Cliente o rol desconocido: silueta de persona -->
      <svg
        th:case="*"
        class="h-10 w-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <circle cx="12" cy="8.4" r="3.9" />
        <path d="M4.6 20a7.4 7.4 0 0 1 14.8 0" />
      </svg>
    </span>
  </body>
</html>
