<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="navigation">
      <span
        id="cashierShortcutConfig"
        th:attr="data-loyalty-enabled=${@licenseService.hasCustomerModuleAccess() and @featureAccessService.isEnabled('LOYALTY')},
                 data-restaurant-open=${isRestaurantOpen == null or isRestaurantOpen},
                 data-system-logo-url=${globalSystemConfig != null and globalSystemConfig.systemLogoUrl != null and !globalSystemConfig.systemLogoUrl.isEmpty() ? @cloudinaryUrl.logoSmall(globalSystemConfig.systemLogoUrl) : ''},
                 data-system-name=${globalSystemConfig != null and globalSystemConfig.systemName != null ? globalSystemConfig.systemName : 'SavoryCloud'}"
        hidden
      ></span>
      <link rel="stylesheet" th:href="@{/css/keyboard-shortcuts.css}" />
      <script th:src="@{/js/keyboard-shortcuts.js}" defer></script>
      <script>
        document.body.dataset.shortcutsProfile = "cashier";
      </script>
    </th:block>
  </body>
</html>
