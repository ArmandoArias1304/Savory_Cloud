<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- ========================================
         FRAGMENTO - TICKETS POR PERSONA (CUENTA DIVIDIDA)
         ========================================

         Filas de acordeón con los N tickets de una orden pagada en
         cuentas (división de cuenta o cobro por persona que se va):
         una fila por cuenta con su folio, método, total, ticket y
         autofactura, más el botón "Ver N ticket(s) por persona".

         USO: dentro del <tbody> de una tabla de pedidos, con "order" y
         "role" disponibles (role = cashier | admin | waiter):

         <th:block th:replace="~{fragments/split-tickets :: accounts(${order}, ${currentRole})}"></th:block>

         El toggle lo maneja el script .payments-toggle de la página.
    ======================================== -->

    <th:block th:fragment="accounts(order, role)">
      <!-- Acordeón de tickets: cuando la orden se pagó en varias cuentas (diferentes personas) -->
      <tr
        th:if="${order.payments != null and order.payments.size() > 1}"
        class="border-b border-gray-100 dark:border-gray-800/60 bg-gray-50/60 dark:bg-gray-900/40"
      >
        <td colspan="10" class="px-6 py-2">
          <button
            type="button"
            class="payments-toggle flex items-center gap-2 w-full text-left cursor-pointer group"
            aria-expanded="false"
          >
            <span
              class="material-symbols-outlined payments-chevron text-gray-400 text-base transition-transform group-hover:text-primary"
              >expand_more</span
            >
            <span
              class="text-xs font-semibold text-gray-500 dark:text-gray-400 group-hover:text-primary transition-colors"
            >
              Ver
              <span th:text="${order.payments.size()}">2</span>
              ticket(s) por persona
            </span>
          </button>
        </td>
      </tr>
      <!-- Split accounts (children of a split payment) -->
      <tr
        th:each="payment : ${order.payments}"
        class="payments-detail border-b border-gray-100 dark:border-gray-800/60 bg-gray-50/60 dark:bg-gray-900/40"
        th:style="${order.payments != null and order.payments.size() > 1 ? 'display:none' : ''}"
      >
        <td colspan="10" class="px-6 py-3">
          <!-- Cuenta + sus acciones (ticket y autofactura) juntas a la izquierda:
               la fila abarca las 10 columnas de la tabla, así que los botones al
               extremo derecho quedaban fuera de vista sin scroll horizontal. -->
          <div class="flex items-center gap-3 flex-wrap min-w-0">
            <div class="flex items-center gap-x-3 gap-y-1 flex-wrap min-w-0">
              <span
                class="material-symbols-outlined text-teal-600 dark:text-teal-400 text-base"
                >group</span
              >
              <span
                class="text-xs font-semibold text-gray-700 dark:text-gray-300"
                th:text="${payment.personLabel != null ? payment.personLabel : ('Cuenta ' + payment.accountNumber)}"
              ></span>
              <span
                class="text-xs font-mono text-gray-500 dark:text-gray-400"
                th:text="${payment.paymentFolio}"
              ></span>
              <span
                class="text-xs text-gray-500 dark:text-gray-400"
                th:text="${payment.paymentMethodsDisplay}"
              ></span>
              <span
                class="text-xs font-semibold text-gray-900 dark:text-white"
                th:text="${'$' + #numbers.formatDecimal(payment.total, 1, 2)}"
              ></span>
            </div>
            <div class="flex items-center gap-2">
              <a
                th:href="@{/{role}/orders/{id}/download-ticket/{pid}(role=${role}, id=${order.idOrder}, pid=${payment.idPayment})}"
                class="p-1.5 rounded-lg bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400 hover:bg-green-100 dark:hover:bg-green-900/40 transition-all"
                title="Descargar ticket de esta cuenta"
              >
                <i class="fas fa-receipt"></i>
              </a>
              <a
                th:href="@{/autofactura/{key}(key=${payment.autofacturaKey})}"
                class="p-1.5 rounded-lg bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400 hover:bg-purple-100 dark:hover:bg-purple-900/40 transition-all"
                title="Autofactura de esta cuenta"
              >
                <i class="fas fa-file-invoice"></i>
              </a>
            </div>
          </div>
          <!-- Detalle: cuánto consumió esta persona (cantidad × producto) -->
          <div
            th:if="${payment.paymentDetails != null and !payment.paymentDetails.isEmpty()}"
            class="mt-2 pt-2 border-t border-gray-100 dark:border-gray-700"
          >
            <p
              class="text-[11px] font-semibold uppercase tracking-wide text-gray-400 dark:text-gray-500 mb-1"
            >
              Consumió
            </p>
            <div class="flex flex-wrap gap-x-5 gap-y-0.5">
              <span
                th:each="pd : ${payment.paymentDetails}"
                class="text-xs text-gray-600 dark:text-gray-400 whitespace-nowrap"
              >
                <span
                  class="font-bold text-gray-900 dark:text-white"
                  th:text="${pd.quantityDisplay}"
                >2</span
                >×&nbsp;<span th:text="${pd.itemName}">Coca-Cola</span>
                <span
                  class="font-semibold text-gray-900 dark:text-white"
                  th:text="${'$' + #numbers.formatDecimal(pd.total, 1, 2)}"
                >$0.00</span
                >
              </span>
            </div>
          </div>
        </td>
      </tr>
    </th:block>
  </body>
</html>
