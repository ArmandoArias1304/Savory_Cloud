<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <!-- ========================================
         FRAGMENTO DE TEMA - EL GRAN SAZÓN
         ========================================
         
         Incluye los archivos CSS y JS necesarios
         para el sistema de modo claro/oscuro.
         
         USO: Incluir en el <head> de cada página:
         <div th:replace="~{fragments/theme :: themeResources}"></div>
    ======================================== -->

    <!-- Fragment: Recursos del Sistema de Temas -->
    <th:block th:fragment="themeResources">
      <!-- Favicon del sistema (GLOBAL - solo se muestra si hay logo configurado) -->
      <link
        rel="icon"
        type="image/png"
        sizes="96x96"
        th:if="${globalSystemConfig != null and globalSystemConfig.systemLogoUrl != null and !globalSystemConfig.systemLogoUrl.isEmpty()}"
        th:href="${@cloudinaryUrl.logoSmall(globalSystemConfig.systemLogoUrl)}"
      />

      <!-- Script inline para prevenir el flash de modo claro (FOUC) -->
      <script>
        // Ejecutar ANTES de que se renderice la página
        (function () {
          const savedTheme = localStorage.getItem("elgransazon-theme");
          if (savedTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        })();

        /**
         * Utility: Apply Cloudflare Images flexible variant transformations to a delivery URL.
         * Recognizes both legacy Cloudinary URLs (returned unchanged) and the current
         * imagedelivery.net format. Replaces the trailing variant segment with the new params.
         *
         * @param {string} url - delivery URL (https://imagedelivery.net/{hash}/{id}/{variant})
         * @param {string} transformations - e.g. "w=400,fit=cover,quality=85,format=auto"
         * @returns {string} transformed URL
         */
        function cloudinaryOptimize(url, transformations) {
          if (!url || !url.includes('imagedelivery.net')) return url;
          var lastSlash = url.lastIndexOf('/');
          if (lastSlash === -1) return url;
          return url.substring(0, lastSlash + 1) + transformations;
        }
      </script>

      <!-- CSS del sistema de temas -->
      <link
        rel="stylesheet"
        th:href="@{/css/theme.css}"
        href="/css/theme.css"
      />
      <!-- Bloquea que la rueda del ratón cambie inputs type="number" -->
      <script
        th:src="@{/js/prevent-number-wheel.js}"
        src="/js/prevent-number-wheel.js"
      ></script>
    </th:block>

  </head>

  <body>
    <!-- Fragment: Script del Sistema de Temas (incluir al final del body) -->
    <th:block th:fragment="themeScript">
      <!-- JavaScript del toggle de tema -->
      <script
        th:src="@{/js/theme-toggle.js}"
        src="/js/theme-toggle.js"
        defer
      ></script>

      <!-- Salvapantallas por inactividad -->
      <div
        sec:authorize="!isAnonymous() and !hasRole('CLIENT')"
        id="savoryScreensaver"
        class="sc-screen"
        data-idle-minutes="5"
        aria-hidden="true"
      >
        <style>
          /* ============ Salvapantallas (marca SavoryCloud + restaurante) ============ */
          .sc-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            font-family: "Work Sans", system-ui, -apple-system, Segoe UI, sans-serif;
            color: #ffffff;
            background:
              radial-gradient(
                circle at 18% 12%,
                rgba(56, 224, 123, 0.3),
                transparent 55%
              ),
              radial-gradient(
                circle at 84% 82%,
                rgba(43, 200, 102, 0.22),
                transparent 50%
              ),
              linear-gradient(160deg, #0b1f16 0%, #0f1713 55%, #071009 100%);
            transition:
              opacity 0.45s ease,
              visibility 0.45s ease;
          }

          .sc-screen.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
          }

          /* Puntitos que se desplazan lentamente, igual que en la bienvenida */
          .sc-screen-dots {
            position: absolute;
            inset: -10%;
            background-image: radial-gradient(
              rgba(56, 224, 123, 0.22) 1.6px,
              transparent 1.6px
            );
            background-size: 28px 28px;
            animation: sc-screen-drift 60s linear infinite;
          }

          @keyframes sc-screen-drift {
            from {
              transform: translate3d(0, 0, 0);
            }
            to {
              transform: translate3d(-28px, -28px, 0);
            }
          }

          .sc-screen-content {
            position: relative;
            z-index: 2;
            flex: 1 1 auto;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: clamp(24px, 5vh, 56px) clamp(20px, 5vw, 48px);
            opacity: 0;
            transform: translateY(18px) scale(0.97);
          }

          .sc-screen.active .sc-screen-content {
            animation: sc-screen-in 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s
              forwards;
          }

          @keyframes sc-screen-in {
            to {
              opacity: 1;
              transform: translateY(0) scale(1);
            }
          }

          /* ============ Logos ============ */
          .sc-screen-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(18px, 4vw, 48px);
            margin-bottom: clamp(24px, 5vh, 52px);
            flex-wrap: wrap;
          }

          .sc-screen-logo {
            width: clamp(110px, 20vw, 176px);
            height: clamp(110px, 20vw, 176px);
            border-radius: clamp(24px, 4vw, 40px);
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow:
              0 20px 44px rgba(0, 0, 0, 0.4),
              0 6px 16px rgba(0, 0, 0, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(14px, 2.6vw, 24px);
            transform: scale(0);
          }

          .sc-screen.active .sc-screen-logo {
            animation: sc-screen-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s
              forwards;
          }

          .sc-screen.active .sc-screen-logo:nth-child(2) {
            animation-delay: 0.3s;
          }

          @keyframes sc-screen-pop {
            to {
              transform: scale(1);
            }
          }

          .sc-screen-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
          }

          /* Sin logo cargado: inicial del restaurante, para que nunca se vea vacío */
          .sc-screen-initial {
            font-size: clamp(42px, 8vw, 76px);
            font-weight: 800;
            color: #2bc866;
            line-height: 1;
            letter-spacing: -0.02em;
          }

          /* ============ Nombre y eslogan ============ */
          .sc-screen-name {
            font-size: clamp(30px, 6vw, 62px);
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: -0.015em;
            margin: 0;
            text-shadow:
              0 2px 4px rgba(0, 0, 0, 0.35),
              0 12px 32px rgba(0, 0, 0, 0.4);
            opacity: 0;
          }

          .sc-screen-slogan {
            font-size: clamp(16px, 2.6vw, 28px);
            font-weight: 500;
            color: rgba(255, 255, 255, 0.86);
            margin: clamp(12px, 2.4vh, 22px) 0 0;
            max-width: 40ch;
            line-height: 1.4;
            opacity: 0;
          }

          .sc-screen-hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: clamp(26px, 5vh, 52px);
            padding: 10px 20px;
            border: 1px solid rgba(56, 224, 123, 0.35);
            border-radius: 999px;
            background: rgba(56, 224, 123, 0.1);
            color: rgba(255, 255, 255, 0.8);
            font-size: clamp(11px, 1.3vw, 14px);
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0;
          }

          .sc-screen-hint-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38e07b;
            animation: sc-screen-pulse 1.8s ease-in-out infinite;
          }

          @keyframes sc-screen-pulse {
            0%,
            100% {
              opacity: 0.35;
              transform: scale(0.85);
            }
            50% {
              opacity: 1;
              transform: scale(1.15);
            }
          }

          .sc-screen.active .sc-screen-name {
            animation: sc-screen-line 0.6s ease-out 0.45s both;
          }

          .sc-screen.active .sc-screen-slogan {
            animation: sc-screen-line 0.6s ease-out 0.6s both;
          }

          .sc-screen.active .sc-screen-hint {
            animation: sc-screen-line 0.6s ease-out 0.8s both;
          }

          @keyframes sc-screen-line {
            from {
              opacity: 0;
              transform: translateY(14px);
            }
            to {
              opacity: 1;
              transform: translateY(0);
            }
          }

          /* ============ Pie: By SavoryCloud ============ */
          .sc-screen-footer {
            position: relative;
            z-index: 2;
            flex: 0 0 auto;
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: clamp(16px, 3vh, 26px) clamp(20px, 5vw, 48px)
              clamp(30px, 6vh, 60px);
            border-top: 1px solid rgba(56, 224, 123, 0.28);
            text-align: center;
            opacity: 0;
          }

          .sc-screen.active .sc-screen-footer {
            animation: sc-screen-line 0.6s ease-out 1s both;
          }

          .sc-screen-by {
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
            font-size: clamp(14px, 1.8vw, 20px);
            font-weight: 600;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.72);
          }

          .sc-screen-by strong {
            color: #38e07b;
            font-weight: 800;
            letter-spacing: 0.04em;
          }

          @media (prefers-reduced-motion: reduce) {
            .sc-screen-dots,
            .sc-screen-hint-dot {
              animation: none;
            }
            .sc-screen-content,
            .sc-screen-logo,
            .sc-screen-name,
            .sc-screen-slogan,
            .sc-screen-hint,
            .sc-screen-footer {
              animation: none !important;
              opacity: 1;
              transform: none;
            }
          }
        </style>

        <div class="sc-screen-dots"></div>

        <div class="sc-screen-content">
          <div class="sc-screen-logos">
            <!-- Logo de SavoryCloud (el que se configura en el panel del programador) -->
            <div class="sc-screen-logo">
              <img
                th:src="${globalSystemConfig != null and globalSystemConfig.systemLogoUrl != null and !globalSystemConfig.systemLogoUrl.isEmpty()} ? ${@cloudinaryUrl.logoHero(globalSystemConfig.systemLogoUrl)} : '/images/savoryCloudLogo.png'"
                alt="SavoryCloud"
              />
            </div>

            <!-- Logo del restaurante (el que se configura en la configuración del sistema) -->
            <div
              class="sc-screen-logo"
              th:if="${systemConfig != null and systemConfig.restaurantLogoUrl != null and !systemConfig.restaurantLogoUrl.isEmpty()}"
            >
              <img
                th:src="${@cloudinaryUrl.logoHero(systemConfig.restaurantLogoUrl)}"
                th:alt="${systemConfig.restaurantName}"
              />
            </div>
            <div class="sc-screen-logo" th:unless="${systemConfig != null and systemConfig.restaurantLogoUrl != null and !systemConfig.restaurantLogoUrl.isEmpty()}">
              <span
                class="sc-screen-initial"
                th:text="${systemConfig != null and !#strings.isEmpty(systemConfig.restaurantName)} ? ${#strings.substring(systemConfig.restaurantName, 0, 1)} : 'R'"
                >R</span
              >
            </div>
          </div>

          <h1
            class="sc-screen-name"
            th:text="${systemConfig != null and !#strings.isEmpty(systemConfig.restaurantName)} ? ${systemConfig.restaurantName} : ${globalSystemConfig?.systemName}"
          >
            Restaurante
          </h1>

          <p
            class="sc-screen-slogan"
            th:if="${(systemConfig != null and !#strings.isEmpty(systemConfig.slogan)) or (globalSystemConfig != null and !#strings.isEmpty(globalSystemConfig.systemSlogan))}"
            th:text="${systemConfig != null and !#strings.isEmpty(systemConfig.slogan)} ? ${systemConfig.slogan} : ${globalSystemConfig?.systemSlogan}"
          >
            Eslogan
          </p>

          <span class="sc-screen-hint">
            <span class="sc-screen-hint-dot"></span>
            <span>Toca la pantalla o mueve el mouse para continuar</span>
          </span>
        </div>

        <div class="sc-screen-footer">
          <span class="sc-screen-by">
            By
            <strong
              th:text="${globalSystemConfig != null and !#strings.isEmpty(globalSystemConfig.systemName)} ? ${globalSystemConfig.systemName} : 'SavoryCloud'"
              >SavoryCloud</strong
            >
          </span>
        </div>
      </div>

      <script>
        /**
         * Salvapantallas por inactividad.
         *
         * Cualquier actividad (mouse, teclado, scroll, toque) reinicia el contador;
         * si el salvapantallas está visible, la actividad lo cierra y deja la
         * pantalla como estaba. El tiempo se toma de data-idle-minutes (5 min).
         */
        (function () {
          var overlay = document.getElementById("savoryScreensaver");
          if (!overlay || window.SavoryScreensaver) {
            return;
          }

          var MINUTES = parseFloat(overlay.dataset.idleMinutes || "5");
          var idleMs = (isNaN(MINUTES) ? 5 : MINUTES) * 60 * 1000;
          var timer = null;
          var EVENTS = [
            "mousemove",
            "mousedown",
            "click",
            "keydown",
            "wheel",
            "scroll",
            "touchstart",
            "touchmove",
          ];

          function isVisible() {
            return overlay.classList.contains("active");
          }

          function show() {
            if (isVisible()) {
              return;
            }
            overlay.classList.add("active");
            overlay.setAttribute("aria-hidden", "false");
          }

          function hide() {
            if (!isVisible()) {
              return;
            }
            overlay.classList.remove("active");
            overlay.setAttribute("aria-hidden", "true");
          }

          function schedule() {
            window.clearTimeout(timer);
            timer = window.setTimeout(function () {
              if (!isVisible()) {
                show();
              }
            }, idleMs);
          }

          function onActivity() {
            hide();
            schedule();
          }

          EVENTS.forEach(function (name) {
            document.addEventListener(name, onActivity, {
              passive: true,
              capture: true,
            });
          });

          // Si la pestaña estuvo oculta mucho tiempo, al volver se evalúa de nuevo
          document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
              window.clearTimeout(timer);
            } else {
              schedule();
            }
          });

          window.addEventListener("beforeunload", function () {
            window.clearTimeout(timer);
          });

          schedule();

          // API para pruebas y ajustes en caliente
          window.SavoryScreensaver = {
            show: show,
            hide: hide,
            reset: schedule,
            isVisible: isVisible,
            idleMs: function () {
              return idleMs;
            },
            setIdleMs: function (ms) {
              idleMs = ms;
              schedule();
            },
            overlay: overlay,
          };
        })();
      </script>
        </th:block>
    <!-- ========================================
         BOTÓN DE TOGGLE DE TEMA
         ========================================
         
         USO: Incluir en el <body> de cada página:
         <div th:replace="~{fragments/theme :: themeToggleButton}"></div>
    ======================================== -->

    <!-- Fragment: Botón de Toggle (Font Awesome Icons) -->
    <th:block th:fragment="themeToggleButton">
      <button
        id="theme-toggle-btn"
        class="theme-toggle-btn"
        aria-label="Cambiar tema"
        title="Cambiar entre modo claro y oscuro"
      >
        <!-- Icono de sol (modo claro) -->
        <i class="fas fa-sun sun-icon"></i>
        <!-- Icono de luna (modo oscuro) -->
        <i class="fas fa-moon moon-icon"></i>
      </button>
    </th:block>

    <!-- Fragment: Botón de Toggle (Material Icons) -->
    <th:block th:fragment="themeToggleButtonMaterial">
      <button
        id="theme-toggle-btn"
        class="theme-toggle-btn"
        aria-label="Cambiar tema"
        title="Cambiar entre modo claro y oscuro"
      >
        <!-- Icono de sol (modo claro) -->
        <span class="material-symbols-outlined sun-icon">light_mode</span>
        <!-- Icono de luna (modo oscuro) -->
        <span class="material-symbols-outlined moon-icon">dark_mode</span>
      </button>
    </th:block>

    <!-- Fragment: Botón de Toggle (Sin iconos, solo texto) -->
    <th:block th:fragment="themeToggleButtonText">
      <button
        id="theme-toggle-btn"
        class="theme-toggle-btn"
        aria-label="Cambiar tema"
        title="Cambiar entre modo claro y oscuro"
        style="width: auto; padding: 10px 20px; border-radius: 25px"
      >
        <!-- Texto para modo claro -->
        <span class="sun-icon">🌞 Claro</span>
        <!-- Texto para modo oscuro -->
        <span class="moon-icon">🌙 Oscuro</span>
      </button>
    </th:block>
  </body>
</html>
