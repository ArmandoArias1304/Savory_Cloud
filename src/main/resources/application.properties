spring.application.name=savorycloud

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bd_restaurant}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORDSECRET:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP - size the pool to handle concurrent order creation
# Each order uses 1 outer connection + 1 REQUIRES_NEW connection (counter sub-tx)
# A burst of 30 concurrent orders = ~60 connections max; keep headroom for other operations
spring.datasource.hikari.maximum-pool-size=150
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# Set to true in production (HTTPS). Controlled via env var: COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Email Configuration
# Email provider selector: "sendgrid" (default) or "brevo".
# Switch providers by changing EMAIL_PROVIDER without touching code.
app.email.provider=${EMAIL_PROVIDER:brevo}

# SendGrid credentials (used when app.email.provider=sendgrid)
spring.email.password=${SENDGRID_API_KEY:}

# Brevo credentials (used when app.email.provider=brevo)
app.email.brevo.api-key=${BREVO_API_KEY:}

#Default values for email sender
mail.from.email=${FROM_EMAIL}
mail.from.name=${FROM_NAME:SavoryCloud}

# Server Configuration
server.address=0.0.0.0
# Trust proxy headers from Nginx (needed for HTTPS detection and correct redirects)
server.forward-headers-strategy=NATIVE

# Application URL Configuration
app.protocol=${API_PROTOCOL:http}
# Fallback en EmailService.java
app.domain=${API_HOST:localhost}
app.port=${API_PORT:8080}

# Multi-Tenant Configuration
app.base-domain=${BASE_DOMAIN:localhost}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.resolve-lazily=true
file.upload.base-path=src/main/resources/static

# Cloudflare Images Configuration
# - account-id      : found at https://dash.cloudflare.com (right sidebar). Semi-public.
# - images.api-token: API token with permission "Images: Edit". SECRET.
# - images.hash     : public account hash that appears in delivery URLs
#                     (https://imagedelivery.net/{HASH}/{image_id}/{variant})
cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.images.api-token=${CLOUDFLARE_IMAGES_API_TOKEN:}
cloudflare.images.hash=${CLOUDFLARE_IMAGES_HASH:}

# Facturama Configuration (API Multiemisor)
facturama.user=${FACTURAMA_USER}
facturama.password=${FACTURAMA_PASSWORD}
facturama.default-live-mode=${FACTURAMA_LIVE_MODE}

# QZ Tray Message Signing (silent printing - removes Allow/Remember dialog)
# To enable: set QZ_SIGNING_ENABLED=true and provide absolute paths to the keys
# generated in QZ Tray > Advanced > Site Manager (or commercial keys from qz.io)
qz.signing.enabled=${QZ_SIGNING_ENABLED:false}
qz.signing.certificate-path=${QZ_SIGNING_CERT_PATH:}
qz.signing.private-key-path=${QZ_SIGNING_KEY_PATH:}