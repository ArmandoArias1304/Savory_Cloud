spring.application.name=elgransazon

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bd_restaurant}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORDSECRET:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP - size the pool to handle concurrent order creation
# Each order uses 1 outer connection + 1 REQUIRES_NEW connection (counter sub-tx)
# A burst of 30 concurrent orders = ~60 connections max; keep headroom for other operations
spring.datasource.hikari.maximum-pool-size=150
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# Set to true in production (HTTPS). Controlled via env var: COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Email Configuration
spring.email.password=${SENDGRID_API_KEY}

#Default values for email sender
mail.from.email=${FROM_EMAIL}
mail.from.name=${FROM_NAME:SavoryCloud}

# Server Configuration
server.address=0.0.0.0
# Trust proxy headers from Nginx (needed for HTTPS detection and correct redirects)
server.forward-headers-strategy=NATIVE

# Application URL Configuration
app.protocol=${API_PROTOCOL:http}
# Fallback en EmailService.java
app.domain=${API_HOST:localhost}
app.port=${API_PORT:8080}

# Multi-Tenant Configuration
app.base-domain=${BASE_DOMAIN:localhost}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.resolve-lazily=true
file.upload.base-path=src/main/resources/static

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}