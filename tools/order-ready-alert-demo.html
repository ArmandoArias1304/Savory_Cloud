<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Aviso de pedido listo — verificación</title>
    <!--
      Página de verificación, NO forma parte de la aplicación.
      Carga el order-ready-alert.js REAL y el SweetAlert2 REAL (el mismo del CDN que
      usan las listas), y solo simula el audio, que depende del navegador. Así se
      comprueba en pantalla lo que no se puede probar sin un navegador: a quién le
      salta el aviso, cuándo, cuántas veces, con qué texto y que sea la alerta del
      centro (no un aviso de la esquina).

      El marcado de las páginas reales (y el sonido) lo cubren
      OrderReadyAlertViewTest y OrderReadyNotificationOwnerTest.
    -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f8faf9;
        color: #1f2937;
      }
      button {
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        background: #fff;
        border-radius: 8px;
        cursor: pointer;
        margin: 0 6px 6px 0;
      }
      h1 {
        font-size: 20px;
      }
      pre {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Aviso de "pedido listo"</h1>
    <p id="who"></p>
    <div id="buttons"></div>
    <pre id="log">(pulsa un botón)</pre>

    <script src="../src/main/resources/static/js/order-ready-alert.js"></script>
    <script>
      // ---- Registradores: lo que se pueda observar sin depender de la UI real ----
      window.__swal = [];
      window.__sounds = [];

      // SweetAlert REAL, solo espiado: se anota la llamada y se deja pasar al de verdad, para
      // que la alerta que se vea sea la misma que verá el mesero. Si el CDN no cargó (sin red),
      // se anota igual y la página sigue usable.
      var realSwal = window.Swal || null;
      window.Swal = {
        fire: function (options) {
          window.__swal.push(options);
          if (realSwal && typeof realSwal.fire === "function") {
            return realSwal.fire(options);
          }
          return Promise.resolve({ isConfirmed: true });
        },
      };

      // Audio simulado: cuenta las reproducciones sin depender de la política del navegador.
      window.Audio = function (url) {
        var self = this;
        self.src = url;
        self.volume = 0;
        self.muted = false;
        self.currentTime = 0;
        self.play = function () {
          if (!self.muted) {
            window.__sounds.push(url);
          }
          return Promise.resolve();
        };
        self.pause = function () {};
      };

      // Las clases del modo oscuro que ya define cada lista real.
      window.getSwalDarkModeClasses = function () {
        return { popup: "rounded-2xl bg-gray-800", title: "text-white" };
      };

      window.__state = { username: "", role: "" };

      /** Cierra la alerta real entre escenarios: para pasar de uno a otro no se toca el ratón. */
      window.__closeAlert = function () {
        if (realSwal && typeof realSwal.close === "function") {
          realSwal.close();
        }
      };

      /** ¿La alerta está en el centro de la ventana? Es el punto del aviso que se pidió. */
      window.__isCentered = function () {
        var popup = document.querySelector(".swal2-popup");
        if (!popup) {
          return null;
        }
        var box = popup.getBoundingClientRect();
        var dx = Math.abs(box.left + box.width / 2 - window.innerWidth / 2);
        var dy = Math.abs(box.top + box.height / 2 - window.innerHeight / 2);
        return {
          desvioX: Math.round(dx),
          desvioY: Math.round(dy),
          centrado: dx < 24 && dy < 60,
        };
      };

      // Aviso de ejemplo, como lo manda el servidor.
      window.notice = function (overrides) {
        var base = {
          orderId: 101,
          orderNumber: "ORD-0101",
          status: "READY",
          notificationType: "STATUS_CHANGE",
          orderType: "DINE_IN",
          orderTypeLabel: "Para comer aquí",
          tableNumber: 7,
          createdBy: "meseroA",
          operatedBy: null,
        };
        return Object.assign(base, overrides || {});
      };

      window.useUser = function (username, role) {
        window.__state = { username: username, role: role };
        window.__swal = [];
        window.__sounds = [];
        OrderReadyAlert.reset();
        OrderReadyAlert.init({ username: username, role: role });
        document.getElementById("who").textContent =
          "Sesión: " + username + " (" + role + ")";
        return true;
      };

      // ---- Los escenarios, cada uno en un botón ----
      var scenarios = [
        ["Soy el mesero y el pedido es mío", function () {
          useUser("meseroA", "waiter");
          return OrderReadyAlert.handle(notice({ createdBy: "meseroA", operatedBy: "meseroA" }));
        }],
        ["Traspasé el pedido: ya NO es mío", function () {
          useUser("meseroA", "waiter");
          return OrderReadyAlert.handle(notice({ createdBy: "meseroA", operatedBy: "meseroB" }));
        }],
        ["Me lo traspasaron: ahora SÍ es mío", function () {
          useUser("meseroB", "waiter");
          return OrderReadyAlert.handle(notice({ createdBy: "meseroA", operatedBy: "meseroB" }));
        }],
        ["Mesero sin asignar: manda el creador", function () {
          useUser("meseroA", "waiter");
          return OrderReadyAlert.handle(notice({ createdBy: "meseroA", operatedBy: null }));
        }],
        ["Cajero: el pedido es del tablero global", function () {
          useUser("cajera1", "cashier");
          return OrderReadyAlert.handle(notice({ createdBy: "meseroA", operatedBy: "meseroA" }));
        }],
        ["Cajero: lo levanté yo", function () {
          useUser("cajera1", "cashier");
          return OrderReadyAlert.handle(notice({ createdBy: "cajera1", operatedBy: null }));
        }],
        ["El mismo pedido avisa dos veces", function () {
          useUser("meseroA", "waiter");
          var first = OrderReadyAlert.handle(notice({ createdBy: "meseroA" }));
          var second = OrderReadyAlert.handle(notice({ createdBy: "meseroA" }));
          return first + " / " + second;
        }],
        ["Sigue listo: una foto de ítems no avisa", function () {
          useUser("meseroA", "waiter");
          return OrderReadyAlert.handle(
            notice({ createdBy: "meseroA", notificationType: "ORDER_DETAIL" }),
          );
        }],
        ["Cambió a en preparación: no avisa", function () {
          useUser("meseroA", "waiter");
          return OrderReadyAlert.handle(
            notice({ createdBy: "meseroA", status: "IN_PREPARATION" }),
          );
        }],
        ["Domicilio sin mesa: se nombra por su tipo", function () {
          useUser("meseroA", "waiter");
          return OrderReadyAlert.handle(
            notice({
              orderId: 102,
              orderNumber: "ORD-0102",
              tableNumber: null,
              orderType: "DELIVERY",
              orderTypeLabel: "Entrega a domicilio",
              createdBy: "meseroA",
            }),
          );
        }],
        ["Para pasar a recoger, sin mesa", function () {
          useUser("meseroA", "waiter");
          return OrderReadyAlert.handle(
            notice({
              orderId: 103,
              orderNumber: "ORD-0103",
              tableNumber: null,
              orderType: "TAKEOUT",
              orderTypeLabel: "Para pasar a recoger",
              createdBy: "meseroA",
            }),
          );
        }],
        ["Nueva ronda: vuelve a quedar listo", function () {
          useUser("meseroA", "waiter");
          var first = OrderReadyAlert.handle(notice({ createdBy: "meseroA" }));
          OrderReadyAlert.handle(notice({ createdBy: "meseroA", status: "IN_PREPARATION" }));
          var second = OrderReadyAlert.handle(notice({ createdBy: "meseroA" }));
          return first + " / " + second;
        }],
      ];

      var container = document.getElementById("buttons");
      scenarios.forEach(function (scenario) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = scenario[0];
        button.addEventListener("click", function () {
          var result = scenario[1]();
          document.getElementById("log").textContent = JSON.stringify(
            {
              resultado: result,
              alertas: window.__swal.length,
              titulo: window.__swal[0] ? window.__swal[0].title : null,
              boton: window.__swal[0] ? window.__swal[0].confirmButtonText : null,
              html: window.__swal[0] ? window.__swal[0].html : null,
              clases: window.__swal[0] ? window.__swal[0].customClass : null,
              sonidos: window.__sounds,
              // Lo que de verdad se ve en pantalla: la alerta del centro de SweetAlert, no un
              // aviso de la esquina (los de esquina llevan la clase swal2-toast).
              swalReal: !!document.querySelector(".swal2-popup"),
              esAvisoDeEsquina: !!document.querySelector(".swal2-toast"),
              centradoEnPantalla: window.__isCentered()
            },
            null,
            2,
          );
        });
        container.appendChild(button);
      });

      useUser("meseroA", "waiter");
    </script>
  </body>
</html>
