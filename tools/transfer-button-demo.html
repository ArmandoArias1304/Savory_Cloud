<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Botón de traspaso — verificación</title>
    <!--
      Página de verificación, NO forma parte de la aplicación.

      El botón de "transferir a otro mesero" no hacía nada. La causa era del enganche: el
      listener vivía en un DOMContentLoaded donde "scope" no existe (una referencia que se
      caía con ReferenceError) y, además, no estaba dentro de la función que vuelve a
      enganchar los botones copiados a las tarjetas y al detalle.

      Esta página NO copia el código: lee la plantilla REAL
      (templates/waiter/orders/list.html), le saca sus bloques <script> y los ejecuta aquí,
      para que lo que se pruebe sea siempre el archivo de verdad. Después arma una fila de
      prueba con su botón de traspaso, y una copia del botón (como la que OrdersView hace
      para las tarjetas), y prueba a pulsarlos.

      Lo único que se sustituye es el mapa de compañeros meseros, que en la página real lo
      escribe el servidor y aquí no existe: sin compañeros el modal diría "Sin compañeros
      disponibles" y no se podría ver si el botón responde.

      Uso:  tools/transfer-button-demo.html            (la plantilla real)
            tools/transfer-button-demo.html?fuente=…    (otro archivo, para comparar)
    -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f8faf9; }
      pre { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; font-size: 12px; }
      button, a.fake { font: inherit; }
    </style>
  </head>
  <body>
    <h1>Botón de traspaso del mesero</h1>
    <p id="estado">Cargando la plantilla…</p>
    <pre id="log">(cargando)</pre>

    <!-- La fila de prueba: el botón tal como lo escribe el servidor en la tabla. -->
    <table>
      <tbody id="filas">
        <tr data-order-id="110">
          <td>
            <a
              class="btn-transfer-order"
              data-order-id="110"
              data-order-number="ORD-20261015-110"
              href="#"
              >transferir</a
            >
          </td>
        </tr>
      </tbody>
    </table>

    <p>Copias (tarjeta y detalle), enganchadas como lo hace la lista:</p>
    <div id="copias"></div>

    <script>
      var FUENTE = new URLSearchParams(location.search).get("fuente") ||
        "../src/main/resources/templates/waiter/orders/list.html";
      var COLEGAS = { "3": "Luis Gomez" };

      function log(texto) {
        document.getElementById("log").textContent = texto;
      }

      /** Los bloques <script> en línea de la plantilla, en orden. */
      function bloquesDe(html) {
        var bloques = [];
        var re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi;
        var m;
        while ((m = re.exec(html)) !== null) {
          bloques.push(m[1]);
        }
        return bloques;
      }

      // La página real carga SockJS y Stomp; aquí se simulan para poder repetir su
      // DOMContentLoaded y ver qué falla en el enganche antes de tocar ningún botón.
      window.SockJS = function () {};
      window.Stomp = { over: function () { return { connect: function () {}, debug: null }; } };

      (async function () {
        var respuesta = await fetch(FUENTE);
        var html = await respuesta.text();
        var bloques = bloquesDe(html);

        // El único cambio: los compañeros que normalmente escribe el servidor.
        bloques = bloques.map(function (codigo) {
          return codigo.replace(
            /const waiterColleagues = \/\*\[\[\$\{waiterColleagues\}\]\]\*\/ \{\};/,
            "const waiterColleagues = " + JSON.stringify(COLEGAS) + ";",
          );
        });

        var errores = [];
        window.addEventListener("error", function (evento) {
          errores.push(String(evento.message));
        });

        bloques.forEach(function (codigo) {
          var etiqueta = document.createElement("script");
          etiqueta.textContent = codigo;
          document.body.appendChild(etiqueta);
        });

        // La página llama a esto en su DOMContentLoaded (y OrdersView lo llama para cada copia).
        bindOrderActionButtons(document);

        // Una copia del botón, como la que hace la tarjeta: nace sin listeners.
        var copia = document.createElement("a");
        copia.className = "btn-transfer-order";
        copia.setAttribute("data-order-id", "111");
        copia.setAttribute("data-order-number", "ORD-0111");
        copia.textContent = "transferir (copia de tarjeta)";
        copia.href = "#";
        document.getElementById("copias").appendChild(copia);
        bindOrderActionButtons(copia.parentNode);

        document.getElementById("estado").textContent =
          "Cargados " + bloques.length + " bloques. Botones listos: pulsa uno.";
        log(
          JSON.stringify(
            {
              fuente: FUENTE,
              bloques: bloques.length,
              erroresAlCargar: errores,
              botonesEnganchados: document.querySelectorAll(".btn-transfer-order").length,
            },
            null,
            2,
          ),
        );

        // Repite el DOMContentLoaded de la página: es donde vivía el enganche roto.
        window.__dispararCarga = function () {
          var capturados = [];
          var recolector = function (evento) {
            capturados.push(String(evento.message));
          };
          window.addEventListener("error", recolector);
          document.dispatchEvent(new Event("DOMContentLoaded"));
          window.removeEventListener("error", recolector);
          return capturados;
        };

        // Latido: deja ver desde fuera si el modal llegó a abrirse.
        window.__transferPrueba = function (cual) {
          window.__swalAbiertos = [];
          var boton =
            document.querySelectorAll(".btn-transfer-order")[cual === "copia" ? 1 : 0];
          boton.click();
          return {
            titulo: (document.querySelector(".swal2-title") || {}).textContent || null,
            opciones: Array.from(document.querySelectorAll(".swal2-select option")).map(
              function (o) { return o.value + "=" + o.textContent; },
            ),
            texto: (document.querySelector(".swal2-html-container") || {}).textContent || null,
            errores: errores,
          };
        };
      })();
    </script>
  </body>
</html>
