services:
  # --- Backend Spring Boot ---
  savorycloud:
    container_name: savorycloud_api
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 768m
    # Heap explícito: por defecto la JVM toma 25% del límite del contenedor (128m con 512m)
    # y el old gen se saturaba al 99.7%. 384m elimina la presión de GC.
    entrypoint: ["java", "-Xms128m", "-Xmx384m", "-XX:MaxMetaspaceSize=192m", "-XX:+UseSerialGC", "-Duser.timezone=UTC", "-jar", "savorycloud.jar"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Mapea el puerto definido en .env al puerto interno 8080 de Tomcat
      - "${API_PORT}:8080"
    environment:
      # Pasa las variables del .env al contenedor
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - API_PROTOCOL=${API_PROTOCOL}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Configuración de Base de Datos
      - DB_HOST=mysqldb # Nombre del servicio de abajo (DNS interno de Docker)
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=root
      - DB_PASSWORDSECRET=${DB_PASSWORDSECRET}

      # Email
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
      - FROM_NAME=${FROM_NAME}

      # Cloudflare Images (CDN de imágenes con transformaciones flexibles)
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_IMAGES_API_TOKEN=${CLOUDFLARE_IMAGES_API_TOKEN}
      - CLOUDFLARE_IMAGES_HASH=${CLOUDFLARE_IMAGES_HASH}

      # Facturama (Facturación electrónica)
      - FACTURAMA_USER=${FACTURAMA_USER}
      - FACTURAMA_PASSWORD=${FACTURAMA_PASSWORD}
      - FACTURAMA_LIVE_MODE=${FACTURAMA_LIVE_MODE:-false}

      # QZ Tray Silent Printing (message signing)
      - QZ_SIGNING_ENABLED=${QZ_SIGNING_ENABLED:-false}
      - QZ_SIGNING_CERT_PATH=/qz-keys/digital-certificate.txt
      - QZ_SIGNING_KEY_PATH=/qz-keys/private-key.pem

    restart: always
    depends_on:
      mysqldb:
        condition: service_healthy
    volumes:
      # Persists database backups across container restarts and deployments.
      # Path must match getBackupDirectory() in BackupServiceImpl:
      # System.getProperty("user.home") + "/savorycloud_backups" = /root/savorycloud_backups
      - backup_data:/root/savorycloud_backups
      # QZ Tray signing keys (read-only). The host folder must contain
      # digital-certificate.txt and private-key.pem.
      - ./qz-keys:/qz-keys:ro
    networks:
      - savorycloud-network

  # --- Base de Datos MySQL ---
  mysqldb:
    image: mysql:8.0.33
    container_name: savorycloud_db
    # Use mysql_native_password so MariaDB client (Alpine) can authenticate for backups.
    # caching_sha2_password (MySQL 8 default) is not supported by mariadb-dump.
    command:
      - --default-authentication-plugin=mysql_native_password
      # --- Tuning para que MySQL 8 quepa cómodo en el contenedor ---
      # performance_schema solo es telemetría interna: ahorra 100-200 MB.
      - --performance-schema=OFF
      # Pico real observado: 28 conexiones concurrentes.
      - --max-connections=50
      - --innodb-buffer-pool-size=128M
      - --table-open-cache=400
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --innodb-log-buffer-size=8M
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Solo accesible desde localhost — usar SSH tunnel para Workbench/DBeaver
      - "127.0.0.1:3307:${DB_PORT}"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORDSECRET}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_PASSWORD=${DB_PASSWORDSECRET}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savorycloud-network

volumes:
  mysql_data:
  backup_data:

networks:
  savorycloud-network:
    driver: bridge
